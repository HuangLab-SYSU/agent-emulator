name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The release page is authoritative once created: a re-pushed tag must
      # never rewrite its notes, so the file under docs/release-notes/ only
      # seeds a brand-new release.
      - name: Create release (leaves an existing release untouched)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; keeping its notes as-is"
            exit 0
          fi
          EXTRA=""
          if [[ "$TAG" == *-* ]]; then EXTRA="--prerelease"; fi
          NOTES="docs/release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then
            TITLE="$(sed -n 's/^#[[:space:]]*//p' "$NOTES" | head -n 1)"
            [ -n "$TITLE" ] || TITLE="$TAG"
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file "$NOTES" $EXTRA
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes $EXTRA
          fi
