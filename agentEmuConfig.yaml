base:
  blockemulator_config: ./config.yaml
  result_dir: ./exp/wait-for-funds
  # Module root of BlockEmulator-X (contains go.mod and cmd/); used to build
  # and launch the cluster when chain.enabled is true. Default: working dir.
  module_root: "."
experiment:
  seed: 20260903
  # Alice waits for two incoming payments before paying Bob.
  trace: ./traces/wait_for_funds.jsonl
chain:
  # When true, each round's transaction plan is automatically executed on a
  # freshly launched BlockEmulator-X cluster (consensus nodes + supervisor):
  # agentemu builds the binaries, derives a per-round config and ip table,
  # replays the plan via tx_source=trace_source_JSONL, and waits for the cluster to
  # stop by itself. With agent_api.enabled=true, one cluster stays alive for
  # the entire experiment; this timeout includes startup, active time and drain.
  enabled: true
  run_timeout_seconds: 600    # hard bound for one whole chain run
  node_exit_grace_seconds: 15 # grace for nodes to exit after the supervisor
loop:
  # Caps the simulation loop; 1 means a single pass over the trace. Rounds
  # beyond the first require an AgentAPI feedback implementation.
  max_rounds: 1
protocols:
  pay:
    plugin: direct-pay
  identity:
    plugin: did-simple
    contract_address: "0x0000000000000000000000000000000000000030"

# Optional online mode; keep the existing trace and result settings above.
# Choose an agent_id present in experiment.trace and a fresh result_dir.
agent_api:
  # Set true to enable one API-controlled agent alongside trace-driven peers.
  enabled: true
  agent_id: agent-alice
  # Real genesis allocation; omitted = the original default initial balance.
  initial_balance: "2"
  adapter: chat-completions
  # Replace with your provider's compatible endpoint prefix (ending in /v1,
  # for example). The adapter appends /chat/completions.
  base_url: https://api.deepseek.com
  model: deepseek-flash
  # Plain-text key file, resolved relative to this YAML; ignored by Git.
  api_key_file: ./.secrets/deepseek_api_key
  # Alternative: remove api_key_file and use api_key_env: DEEPSEEK_API_KEY
  goal: >-
    Pay agent-bob exactly 10 units once. If your available_balance is below 10,
    wait for incoming transfers; never send a partial payment or leave.
    Once your available_balance is at least 10 and Bob is active, pay exactly 10.
    After completing that payment, wait.
  # GLOBAL quota across ALL shards; empty/nonempty/in-flight blocks count.
  # 0 pauses proposals immediately after the observation barrier.
  # Omitted defaults to 5. Reaching the cap does not terminate the chain.
  max_blocks_during_decision: 5
  decision_timeout_seconds: 60
  # Interval is measured after completion/validation; one API call at a time.
  decision_interval_seconds: 10
  run_duration_seconds: 120
  drain_timeout_seconds: 60
  # Trace ts differences are milliseconds; 1 = real-time, 2 = twice as fast.
  trace_time_scale: 1
